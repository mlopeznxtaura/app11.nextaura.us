server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location / {
        try_files /index.html =404;
    }
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"paused","host":"app2.nextaura.us","device":"none","message":"L4 stopped; 5090 Tuesday"}';
    }
}
